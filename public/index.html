<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APES CRM - Customer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-6">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">APES CRM</h1>
                <p class="text-gray-600">Customer Dashboard</p>
            </div>
            <div>
                <button id="loginBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                    Login
                </button>
            </div>
        </header>

        <div id="loginForm" class="hidden bg-white p-8 rounded-lg shadow-md max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-6">Login to APES CRM</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="emailInput" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your email">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="passwordInput" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your password">
                </div>
                <button id="submitLogin" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors">
                    Login
                </button>
            </div>
            <div id="loginError" class="mt-4 text-red-600 hidden">Invalid credentials</div>
        </div>

        <div id="dashboard" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                <h2 class="text-xl font-bold mb-4">Welcome to APES CRM</h2>
                <p class="text-gray-600">You're logged in as <span id="userEmail" class="font-semibold text-blue-600"></span></p>
                <button id="logoutBtn" class="mt-4 bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors">
                    Logout
                </button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-lg font-semibold mb-4">Connection Status</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-green-50 border border-green-200 p-4 rounded-lg">
                        <h4 class="font-semibold text-green-800">Tiendanube</h4>
                        <p class="text-green-600">Connected</p>
                        <p class="text-sm text-green-500 mt-1">Store: 34881</p>
                    </div>
                    <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
                        <h4 class="font-semibold text-blue-800">Meta</h4>
                        <p class="text-blue-600">Not Connected</p>
                    </div>
                    <div class="bg-purple-50 border border-purple-200 p-4 rounded-lg">
                        <h4 class="font-semibold text-purple-800">Google AI</h4>
                        <p class="text-purple-600">Not Connected</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md mt-6">
                <h3 class="text-lg font-semibold mb-4">Customer Information</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead>
                            <tr>
                                <th class="py-2 px-4 border-b text-left">Name</th>
                                <th class="py-2 px-4 border-b text-left">Email</th>
                                <th class="py-2 px-4 border-b text-left">Phone</th>
                                <th class="py-2 px-4 border-b text-left">City</th>
                                <th class="py-2 px-4 border-b text-left">DNI/CUIT</th>
                                <th class="py-2 px-4 border-b text-left">Total Spent</th>
                                <th class="py-2 px-4 border-b text-left">Purchases</th>
                                <th class="py-2 px-4 border-b text-left">Segment</th>
                            </tr>
                        </thead>
                        <tbody id="customersTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock user data
        const validUsers = [
            { email: 'commercial1.apes@gmail.com', name: 'APES Commercial' },
            { email: 'jeromontoya18@gmail.com', name: 'Jerónimo Montoya' },
        ];
        
        // Mock customer data
        const mockCustomers = [
            {
                name: 'Valentina Gómez',
                email: 'valentina.gomez.real@gmail.com',
                phone: '+57 311 234 5678',
                city: 'Bogotá',
                dniCuit: '12345678',
                totalSpent: 850000,
                purchaseCount: 3,
                segment: 'vip'
            },
            {
                name: 'Lucas Méndez',
                email: 'lucas.mendez@gmail.com',
                phone: '+57 310 987 6543',
                city: 'Medellín',
                dniCuit: '87654321',
                totalSpent: 1200000,
                purchaseCount: 5,
                segment: 'vip'
            },
            {
                name: 'Camila Díaz',
                email: 'camila.diaz.real@gmail.com',
                phone: '+57 312 555 1234',
                city: 'Cartagena',
                dniCuit: '45678901',
                totalSpent: 320000,
                purchaseCount: 1,
                segment: 'regular'
            }
        ];
        
        // DOM elements
        const loginForm = document.getElementById('loginForm');
        const dashboard = document.getElementById('dashboard');
        const loginBtn = document.getElementById('loginBtn');
        const submitLogin = document.getElementById('submitLogin');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginError = document.getElementById('loginError');
        const userEmail = document.getElementById('userEmail');
        const customersTable = document.getElementById('customersTable');
        
        // Event listeners
        loginBtn.addEventListener('click', () => {
            loginForm.classList.remove('hidden');
            dashboard.classList.add('hidden');
            loginBtn.classList.add('hidden');
        });
        
        submitLogin.addEventListener('click', () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            const user = validUsers.find(u => u.email === email);
            
            if (user && password === 'admin123') {
                loginError.classList.add('hidden');
                loginForm.classList.add('hidden');
                dashboard.classList.remove('hidden');
                loginBtn.classList.remove('hidden');
                
                userEmail.textContent = email;
                renderCustomers(mockCustomers);
            } else {
                loginError.classList.remove('hidden');
            }
        });
        
        function renderCustomers(customers) {
            customersTable.innerHTML = '';
            
            customers.forEach(customer => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                row.innerHTML = `
                    <td class="py-2 px-4 border-b">${customer.name}</td>
                    <td class="py-2 px-4 border-b">${customer.email}</td>
                    <td class="py-2 px-4 border-b">${customer.phone}</td>
                    <td class="py-2 px-4 border-b">${customer.city}</td>
                    <td class="py-2 px-4 border-b">${customer.dniCuit}</td>
                    <td class="py-2 px-4 border-b">$${customer.totalSpent.toLocaleString()}</td>
                    <td class="py-2 px-4 border-b">${customer.purchaseCount}</td>
                    <td class="py-2 px-4 border-b">
                        <span class="px-2 py-1 rounded-full text-xs ${getSegmentClass(customer.segment)}">
                            ${customer.segment}
                        </span>
                    </td>
                `;
                customersTable.appendChild(row);
            });
        }
        
        function getSegmentClass(segment) {
            switch(segment) {
                case 'vip': return 'bg-purple-100 text-purple-800';
                case 'regular': return 'bg-blue-100 text-blue-800';
                case 'abandoned': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            dashboard.classList.add('hidden');
            loginForm.classList.remove('hidden');
            loginBtn.classList.remove('hidden');
            emailInput.value = '';
            passwordInput.value = '';
        });
    </script>
</body>
</html>
